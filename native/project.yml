# Bullet Life, native. Generate the Xcode project with XcodeGen (see README.md):
#   brew install xcodegen && cd native && xcodegen && open BulletLife.xcodeproj
name: BulletLife
options:
  bundleIdPrefix: com.bulletlife
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Your Apple team: export DEVELOPMENT_TEAM=XXXXXXXXXX before running xcodegen, or pick it in Xcode
    # (Signing & Capabilities). A bundle id is unique per team: change PRODUCT_BUNDLE_IDENTIFIER below if Xcode says it is taken.
    DEVELOPMENT_TEAM: ${DEVELOPMENT_TEAM}
    # CocoaPods' framework scripts (ML Kit) need to write outside the sandbox Xcode gives build scripts.
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    # ML Kit's pods (Google) include their own headers with quotes; the app compiles those headers when it imports
    # MLKit, and newer Xcode flags that. Not our code.
    CLANG_WARN_QUOTED_INCLUDE_IN_FRAMEWORK_HEADER: NO
packages:
  BulletLifeCore:
    path: Core
# The app's scheme, shared and always generated (Xcode didn't always create it on its own after xcodegen).
schemes:
  BulletLife:
    build:
      targets:
        BulletLife: all
    run:
      config: Debug
      # Run without the debugger: with it attached, typing sometimes didn't reach the app until it was reopened.
      debugEnabled: false
    archive:
      config: Release
  # The Mac app (Mac Catalyst, optimized for Mac): the same code, without the pen's handwriting recognition
  # (ML Kit has no Mac build, and the Mac has no pen). Run it with this scheme on "My Mac".
  BulletLife Mac:
    build:
      targets:
        BulletLife Mac: all
    run:
      config: Debug
      # Run without the debugger: with it attached, typing sometimes didn't reach the app until it was reopened.
      debugEnabled: false
    archive:
      config: Release
targets:
  BulletLife:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
    dependencies:
      - package: BulletLifeCore
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Bullet Life
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bulletlife.notebook
        TARGETED_DEVICE_FAMILY: "1,2"
        # The iPad and iPhone app (with ML Kit's pods): the Mac has its own target below.
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  BulletLife Mac:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes:
          - Info.plist
    dependencies:
      - package: BulletLifeCore
    info:
      path: Mac/Info.plist
      properties:
        CFBundleDisplayName: Bullet Life
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSApplicationCategoryType: public.app-category.productivity
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
    settings:
      base:
        PRODUCT_NAME: Bullet Life
        PRODUCT_BUNDLE_IDENTIFIER: com.bulletlife.notebook
        # Mac Catalyst, optimized for Mac (6): Mac-sized controls and text, the Mac's menus and windows.
        SUPPORTS_MACCATALYST: YES
        TARGETED_DEVICE_FAMILY: "2,6"
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
